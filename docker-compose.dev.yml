services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prerana
      POSTGRES_PASSWORD: prerana
      POSTGRES_DB: prerana_sms
    ports:
      - "5432:5432"
    volumes:
      - prerana_pg_data_dev:/var/lib/postgresql/data

volumes:
  prerana_pg_data_dev:
