server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — any path that isn't a real file falls back to index.html
    # so client-side routes (e.g. /students) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies to the server container's service name in docker-compose.
    # In a non-Docker deployment, replace `server` with the API's real host.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
